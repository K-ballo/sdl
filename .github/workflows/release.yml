name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# The library is header-only, so one package serves every platform: it is
# built and tested once, with the newest GCC.
jobs:
  package:
    name: package
    runs-on: ubuntu-24.04
    if: ${{ !github.event.repository.fork }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.4.0"

      # Built before the toolchain PPA is added, see test.yml.
      - name: Install SDL3
        uses: ./.github/actions/install-sdl

      - name: Set up APT package cache
        run: |
          mkdir -p ~/.cache/apt/archives/partial
          echo "Dir::Cache::archives \"$HOME/.cache/apt/archives\";" \
            | sudo tee /etc/apt/apt.conf.d/99user-cache

      - name: Cache APT packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/apt/archives
          key: apt-ubuntu-24.04-gcc-16-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: apt-ubuntu-24.04-gcc-16-

      - name: Install GCC 16
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update -q
          sudo apt-get install -y gcc-16 g++-16 ninja-build
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100 \
                                   --slave /usr/bin/g++ g++ /usr/bin/g++-16

      - name: Fix APT cache permissions
        if: always()
        run: sudo rm -rf ~/.cache/apt/archives/lock ~/.cache/apt/archives/partial

      - name: Configure
        run: cmake --preset dev-gcc -B build/dev-gcc -DBUILD_DOCS=ON

      - name: Check the tag against the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/dev-gcc/CMakeCache.txt)
          tagged="${TAG#v}"
          if [ "${tagged%%-*}" != "${version}" ]; then
            echo "::error::tag ${TAG} does not match the project version ${version}"
            exit 1
          fi

      - name: Build (Release)
        run: cmake --build build/dev-gcc --config Release

      - name: Test (Release)
        run: >-
          ctest --test-dir build/dev-gcc --build-config Release
          --timeout 300 --output-on-failure --no-compress-output

      - name: Package
        working-directory: build/dev-gcc
        env:
          TAG: ${{ github.ref_name }}
        run: cpack -C Release -D "CPACK_PACKAGE_FILE_NAME=Eggs.SDL-${TAG}"

      - name: Stage packages
        run: |
          mkdir packages
          cp build/dev-gcc/Eggs.SDL-*.tar.gz packages/

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages
          path: packages/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: packages/

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --draft \
            --repo ${{ github.repository }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "${TAG}" \
            packages/* \
            --repo ${{ github.repository }}
