name: test

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # -- Linux / GCC -----------------------------------------------------
          - { os: ubuntu-24.04, compiler: gcc-15, preset: dev-gcc, cc: gcc-15, cxx: g++-15, packages: "gcc-15 g++-15", ppa: ubuntu-toolchain-r }
          - { os: ubuntu-24.04, compiler: gcc-16, preset: dev-gcc, cc: gcc-16, cxx: g++-16, packages: "gcc-16 g++-16", ppa: ubuntu-toolchain-r }
          # -- Linux / Clang ----------------------------------------------------
          - { os: ubuntu-24.04, compiler: clang-21, preset: dev-clang, cc: clang-21, cxx: clang++-21, packages: "clang-21 clang-tools-21 g++-15", llvm_ver: "21", ppa: ubuntu-toolchain-r, gcc_toolchain: "15" }
          - { os: ubuntu-24.04, compiler: clang-22, preset: dev-clang, cc: clang-22, cxx: clang++-22, packages: "clang-22 clang-tools-22 g++-16", llvm_ver: "22", ppa: ubuntu-toolchain-r, gcc_toolchain: "16" }
          # -- Linux / Clang + libc++ -------------------------------------------
          - { os: ubuntu-24.04, compiler: clang-21-libcxx, preset: dev-clang-libcxx, cc: clang-21, cxx: clang++-21, packages: "clang-21 clang-tools-21 libc++-21-dev libc++abi-21-dev g++-15", llvm_ver: "21", ppa: ubuntu-toolchain-r, gcc_toolchain: "15" }
          - { os: ubuntu-24.04, compiler: clang-22-libcxx, preset: dev-clang-libcxx, cc: clang-22, cxx: clang++-22, packages: "clang-22 clang-tools-22 libc++-22-dev libc++abi-22-dev g++-16", llvm_ver: "22", ppa: ubuntu-toolchain-r, gcc_toolchain: "16" }
          # -- Windows / MSVC ---------------------------------------------------
          - { os: windows-2022, compiler: msvc-2022, preset: dev-msvc }
          - { os: windows-2025-vs2026, compiler: msvc-2026, preset: dev-msvc }
          # -- Windows / Clang-CL ------------------------------------------------
          - { os: windows-2025-vs2026, compiler: clang-cl-20, preset: dev-clang-cl }
          # -- macOS / Apple Clang ----------------------------------------------
          - { os: macos-15, compiler: apple-clang-16, preset: dev-clang }
          # -- Latest SDL release (the rows above build the minimum, 3.2.0) -----
          - { os: ubuntu-24.04, compiler: gcc-16-sdl-3.4, preset: dev-gcc, cc: gcc-16, cxx: g++-16, packages: "gcc-16 g++-16", ppa: ubuntu-toolchain-r, sdl_ref: release-3.4.18 }
          - { os: ubuntu-24.04, compiler: clang-22-sdl-3.4, preset: dev-clang, cc: clang-22, cxx: clang++-22, packages: "clang-22 clang-tools-22 g++-16", llvm_ver: "22", ppa: ubuntu-toolchain-r, gcc_toolchain: "16", sdl_ref: release-3.4.18 }
          - { os: windows-2025-vs2026, compiler: msvc-2026-sdl-3.4, preset: dev-msvc, sdl_ref: release-3.4.18 }

    steps:
      - uses: actions/checkout@v5

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.4.0"

      # -- Windows: activate MSVC Developer Command Prompt ---------------------
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -property installationPath
          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja

      # Built before the toolchain PPA is added: the PPA can upgrade libc6, and
      # an SDL3 built (and cached) against that newer glibc fails to link on
      # runners that still have the stock one.
      - name: Install SDL3
        uses: ./.github/actions/install-sdl
        with:
          ref: ${{ matrix.sdl_ref || 'release-3.2.0' }}

      # -- Linux: add optional extra APT sources before install -------------
      - name: Add ubuntu-toolchain-r PPA
        if: matrix.ppa == 'ubuntu-toolchain-r'
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update

      - name: Add LLVM APT source
        if: runner.os == 'Linux' && matrix.llvm_ver != ''
        run: |
          CODENAME=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${{ matrix.llvm_ver }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update

      # -- Linux: cache and install APT packages ----------------------------
      - name: Set up APT package cache
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cache/apt/archives/partial
          echo "Dir::Cache::archives \"$HOME/.cache/apt/archives\";" \
            | sudo tee /etc/apt/apt.conf.d/99user-cache

      - name: Cache APT packages
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ~/.cache/apt/archives
          key: apt-${{ matrix.os }}-${{ matrix.compiler }}-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: apt-${{ matrix.os }}-${{ matrix.compiler }}-

      - name: Install Linux tools and compiler
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends ninja-build ${{ matrix.packages }}

      - name: Fix APT cache permissions
        if: always() && runner.os == 'Linux'
        run: sudo rm -rf ~/.cache/apt/archives/lock ~/.cache/apt/archives/partial

      # -----------------------------------------------------------------------
      # Main project
      # -----------------------------------------------------------------------
      # -- Windows: a crashing or DLL-less test must fail, not wait on a dialog --
      - name: Disable Windows error dialogs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting" /v DontShowUI /t REG_DWORD /d 1 /f
          reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f

      # -----------------------------------------------------------------------
      # Main project
      # -----------------------------------------------------------------------
      - name: Configure
        shell: bash
        run: |
          compiler_args=()
          if [ -n "${{ matrix.cc }}" ]; then
            compiler_args+=(-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
          fi
          if [ -n "${{ matrix.gcc_toolchain }}" ]; then
            compiler_args+=(-DCMAKE_CXX_FLAGS_INIT="--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/${{ matrix.gcc_toolchain }}")
          fi

          cmake --preset ${{ matrix.preset }} -B build/${{ matrix.preset }} \
            "${compiler_args[@]}" \
            -DBUILD_EXAMPLES=ON -DBUILD_TESTING=ON

      - name: Build (Debug)
        run: cmake --build build/${{ matrix.preset }} --config Debug

      - name: Test (Debug)
        run: >-
          ctest --test-dir build/${{ matrix.preset }} --build-config Debug
          --timeout 300 --output-on-failure --no-compress-output
          --output-junit test-results-${{ matrix.compiler }}-debug.xml

      - name: Build (Release)
        run: cmake --build build/${{ matrix.preset }} --config Release

      - name: Test (Release)
        run: >-
          ctest --test-dir build/${{ matrix.preset }} --build-config Release
          --timeout 300 --output-on-failure --no-compress-output
          --output-junit test-results-${{ matrix.compiler }}-release.xml

      - name: Upload test results
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.compiler }}
          path: build/${{ matrix.preset }}/test-results-*.xml
          if-no-files-found: ignore
          retention-days: 30

      # -----------------------------------------------------------------------
      # Consumer variants run on main only
      # -----------------------------------------------------------------------

      # FetchContent variant - simulates embedding via FetchContent_MakeAvailable
      - name: Copy Preset (FetchContent)
        if: github.ref == 'refs/heads/main'
        run: |
          cp ./CMakePresets.json test/cmake-fetch_content
          cp ./example/main.cpp test/cmake-fetch_content/main.cpp

      - name: Test Consumer (FetchContent) - Configure
        if: github.ref == 'refs/heads/main'
        shell: bash
        working-directory: test/cmake-fetch_content
        run: |
          compiler_args=()
          if [ -n "${{ matrix.cc }}" ]; then
            compiler_args+=(-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
          fi

          cmake --preset ${{ matrix.preset }} -B build-consumer-fetch_content \
            "${compiler_args[@]}" \
            -DEGGS_SDL_SOURCE_DIR="${{ github.workspace }}"

      - name: Test Consumer (FetchContent) - Build (Debug)
        if: github.ref == 'refs/heads/main'
        working-directory: test/cmake-fetch_content
        run: cmake --build build-consumer-fetch_content --config Debug

      - name: Test Consumer (FetchContent) - Test (Debug)
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        working-directory: test/cmake-fetch_content
        run: ctest --test-dir build-consumer-fetch_content --build-config Debug --timeout 60 --output-on-failure

      - name: Test Consumer (FetchContent) - Build (Release)
        if: github.ref == 'refs/heads/main'
        working-directory: test/cmake-fetch_content
        run: cmake --build build-consumer-fetch_content --config Release

      - name: Test Consumer (FetchContent) - Test (Release)
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        working-directory: test/cmake-fetch_content
        run: ctest --test-dir build-consumer-fetch_content --build-config Release --timeout 60 --output-on-failure

      # Install variant - simulates a real end-user find_package workflow
      - name: Test Install (Debug)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cmake --install build/${{ matrix.preset }} \
            --prefix "${{ runner.temp }}/eggs-sdl-install" --config Debug

      - name: Test Install (Release)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cmake --install build/${{ matrix.preset }} \
            --prefix "${{ runner.temp }}/eggs-sdl-install" --config Release

      - name: Upload installed package
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: installed-package-${{ matrix.compiler }}
          path: ${{ runner.temp }}/eggs-sdl-install
          if-no-files-found: error
          retention-days: 7

      - name: Clean Source and Build Tree
        if: github.ref == 'refs/heads/main'
        run: cmake -E rm -rf ./include ./src ./build

      - name: Copy main.cpp (find_package)
        if: github.ref == 'refs/heads/main'
        run: cp ./example/main.cpp test/cmake-find_package/main.cpp

      - name: Install CMake (find_package minimum)
        if: github.ref == 'refs/heads/main'
        uses: lukka/get-cmake@latest
        with:
          # CMake 3.21 predates cxx_std_23 support for AppleClang.
          cmakeVersion: ${{ runner.os == 'macOS' && '3.25.0' || '3.21.0' }}

      - name: Test Consumer (find_package) - Configure
        if: github.ref == 'refs/heads/main'
        shell: bash
        working-directory: test/cmake-find_package
        env:
          CXX: ${{ startsWith(matrix.compiler, 'clang-cl') && 'clang-cl' || startsWith(matrix.compiler, 'msvc') && 'cl' || matrix.cxx != '' && matrix.cxx || 'clang++' }}
          CXXFLAGS: ${{ contains(matrix.compiler, 'libcxx') && '-stdlib=libc++' || '' }}
          LDFLAGS: ${{ contains(matrix.compiler, 'libcxx') && '-stdlib=libc++' || '' }}
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/eggs-sdl-install
        run: |
          cmake -S . -B build-consumer-find_package \
            -G "Ninja Multi-Config" --debug-find

      - name: Test Consumer (find_package) - Build (Debug)
        if: github.ref == 'refs/heads/main'
        working-directory: test/cmake-find_package
        run: cmake --build build-consumer-find_package --config Debug

      - name: Test Consumer (find_package) - Test (Debug)
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        working-directory: test/cmake-find_package
        run: ctest --test-dir build-consumer-find_package --build-config Debug --timeout 60 --output-on-failure

      - name: Test Consumer (find_package) - Build (Release)
        if: github.ref == 'refs/heads/main'
        working-directory: test/cmake-find_package
        run: cmake --build build-consumer-find_package --config Release

      - name: Test Consumer (find_package) - Test (Release)
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        working-directory: test/cmake-find_package
        run: ctest --test-dir build-consumer-find_package --build-config Release --timeout 60 --output-on-failure
